<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E0522B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Essen">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Was essen wir?</title>
<style>
  :root {
    --bg: #FBF6EF;
    --karte: #FFFFFF;
    --text: #2A211B;
    --text2: #7C6B5E;
    --linie: #EADFD3;
    --chip: #F1E7DC;
    --akzent: #E0522B;
    --akzent-text: #FFFFFF;
    --akzent-hell: #FDE5DA;
    --kopf: #E0522B;
    --herz: #E5384A;
    --schatten: 0 1px 2px rgba(60, 35, 20, .06), 0 4px 14px rgba(60, 35, 20, .07);
    --oben: env(safe-area-inset-top, 0px);
    --unten: env(safe-area-inset-bottom, 0px);
    --links: env(safe-area-inset-left, 0px);
    --rechts: env(safe-area-inset-right, 0px);
    --tabbar: 58px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16120E;
      --karte: #231C16;
      --text: #F4ECE3;
      --text2: #AE9D8F;
      --linie: #3A3028;
      --chip: #2D241D;
      --akzent: #F06A42;
      --akzent-hell: #44261A;
      --kopf: #A9391A;
      --herz: #FF5A6A;
      --schatten: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html.gesperrt, html.gesperrt body { overflow: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .unsichtbar { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

  /* ---------- Kopf ---------- */
  .statusleiste {
    position: fixed; inset: 0 0 auto 0; height: var(--oben);
    background: var(--kopf); z-index: 30;
  }
  .titelzeile {
    background: var(--kopf); color: #fff;
    padding: calc(var(--oben) + 10px) calc(16px + var(--rechts)) 4px calc(16px + var(--links));
    display: flex; align-items: center; gap: 8px;
  }
  .titelzeile h1 { flex: 1; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .rund {
    width: 44px; height: 44px; border-radius: 22px; border: 0;
    background: rgba(255, 255, 255, .18); color: #fff;
    display: grid; place-items: center;
  }
  .rund:active { background: rgba(255, 255, 255, .32); }
  .rund svg { width: 22px; height: 22px; }

  .klebend { position: sticky; top: var(--oben); z-index: 20; background: var(--bg); }
  .suchzeile {
    background: var(--kopf);
    padding: 6px calc(16px + var(--rechts)) 12px calc(16px + var(--links));
  }
  .suche {
    display: flex; align-items: center; gap: 6px;
    background: #fff; color: #2A211B; border-radius: 12px; height: 44px; padding: 0 4px 0 12px;
  }
  @media (prefers-color-scheme: dark) { .suche { background: #2B221B; color: var(--text); } }
  .suche svg { width: 18px; height: 18px; flex: none; opacity: .5; }
  .suche input {
    flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent;
    font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  .suche input::-webkit-search-cancel-button { display: none; }
  .suche-leeren {
    width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent;
    font-size: 22px; line-height: 1; opacity: .5;
  }

  .chipreihe {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 10px calc(16px + var(--rechts)) 0 calc(16px + var(--links));
    scroll-padding: 0 16px;
  }
  .chipreihe::-webkit-scrollbar { display: none; }
  .chipreihe::after { content: ""; flex: 0 0 8px; }
  .chipreihe.letzte { padding-bottom: 10px; border-bottom: 1px solid var(--linie); }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 0 14px; border-radius: 18px; border: 0;
    background: var(--chip); color: var(--text); font-size: 15px; font-weight: 600; white-space: nowrap;
    position: relative;
  }
  /* unsichtbare Vergrößerung auf 44 px Touch-Höhe */
  .chip::before { content: ""; position: absolute; inset: -4px 0; }
  .chip[aria-pressed="true"] { background: var(--akzent); color: var(--akzent-text); }
  .chip.klein { font-size: 14px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--linie); }
  .chip.klein[aria-pressed="true"] { background: var(--akzent-hell); color: var(--akzent); box-shadow: inset 0 0 0 1.5px var(--akzent); }

  /* ---------- Raster ---------- */
  main {
    padding: 12px calc(16px + var(--rechts)) calc(var(--tabbar) + var(--unten) + 24px) calc(16px + var(--links));
  }
  .infozeile { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-bottom: 8px; color: var(--text2); font-size: 14px; }
  .textknopf { border: 0; background: none; color: var(--akzent); font-weight: 600; font-size: 14px; padding: 8px 0 8px 12px; }
  .raster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 600px) { .raster { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .kachel {
    background: var(--karte); border-radius: 16px; overflow: hidden; box-shadow: var(--schatten);
    display: flex; flex-direction: column; transition: transform .12s;
  }
  .kachel:active { transform: scale(.97); }
  .kachel .bild { aspect-ratio: 1; }
  .kachel-text { padding: 8px 10px 10px; }
  .kachel h3 {
    margin: 0; font-size: 15px; font-weight: 650; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .kachel p { margin: 3px 0 0; font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bild {
    position: relative; overflow: hidden;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    display: grid; place-items: center;
  }
  .bild-emoji { font-size: 56px; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .18)); }
  .bild img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .herz {
    position: absolute; top: 0; right: 0; width: 48px; height: 48px; border: 0; background: none;
    display: grid; place-items: center; padding: 0;
  }
  .herz span {
    width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center;
    background: rgba(255, 255, 255, .85); color: #8B7B70; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .herz svg { width: 20px; height: 20px; }
  .herz[aria-pressed="true"] span { color: var(--herz); }
  .herz:active span { transform: scale(.85); }

  .leer { text-align: center; padding: 48px 16px; color: var(--text2); }
  .leer div { font-size: 48px; margin-bottom: 8px; }

  /* ---------- Tab-Leiste ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; padding: 0 var(--rechts) var(--unten) var(--links);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px);
    border-top: 1px solid var(--linie);
  }
  .tab {
    flex: 1; height: var(--tabbar); border: 0; background: none; color: var(--text2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11.5px; font-weight: 600;
  }
  .tab svg { width: 26px; height: 26px; }
  .tab[aria-current="true"] { color: var(--akzent); }

  /* ---------- Bottom-Sheet ---------- */
  .sheet-huelle { position: fixed; inset: 0; z-index: 50; }
  .sheet-hintergrund { position: absolute; inset: 0; background: rgba(20, 12, 6, .45); opacity: 0; transition: opacity .25s; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--oben) - 16px);
    background: var(--bg); border-radius: 22px 22px 0 0; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .9, .3, 1);
    padding-bottom: calc(var(--unten) + 16px);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .2);
  }
  @media (min-width: 600px) { .sheet { left: 50%; width: 560px; margin-left: -280px; } }
  .sheet-huelle.offen .sheet-hintergrund { opacity: 1; }
  .sheet-huelle.offen .sheet { transform: none; }
  .sheet-griff { position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: rgba(255, 255, 255, .7); z-index: 2; box-shadow: 0 0 4px rgba(0, 0, 0, .25); }
  .sheet-zu {
    position: absolute; top: 10px; right: calc(10px + var(--rechts)); z-index: 3;
    width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0, 0, 0, .35); color: #fff;
    font-size: 24px; line-height: 1; display: grid; place-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  /* Bilder sind quadratisch – so sind sie im Detail vollständig zu sehen */
  .sheet-bild { aspect-ratio: 1; max-height: 62vh; width: 100%; }
  .sheet-bild .bild { height: 100%; }
  .sheet-bild .bild-emoji { font-size: 110px; }
  .sheet-text { padding: 18px calc(20px + var(--rechts)) 4px calc(20px + var(--links)); }
  .sheet-text.ohne-bild { padding-top: 56px; }
  .sheet h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.2; letter-spacing: -.01em; }
  .meta { margin: 0 0 16px; color: var(--text2); font-size: 15px; }
  .abschnitt { margin: 18px 0 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
  .umbruch { display: flex; flex-wrap: wrap; gap: 8px; }
  .hinweis { font-size: 13px; color: var(--text2); margin: 8px 0 0; }

  .aktionen { display: flex; gap: 10px; margin-top: 22px; }
  .knopf {
    flex: 1; min-height: 50px; border-radius: 14px; border: 0; padding: 0 14px;
    background: var(--chip); color: var(--text); font-weight: 650; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  .knopf:active { filter: brightness(.92); }
  .knopf.primaer { background: var(--akzent); color: var(--akzent-text); }
  .knopf.gefahr { color: #D42F2F; }
  .knopf svg { width: 20px; height: 20px; }
  .knopf[aria-pressed="true"] { color: var(--herz); }
  .knopf[aria-pressed="true"] svg { fill: currentColor; }
  .knopf.voll { width: 100%; margin-top: 10px; }

  /* Formular */
  .formular h2 { margin-bottom: 16px; }
  .feld { display: block; margin: 0 0 14px; border: 0; padding: 0; }
  .feld > span, .feld legend { display: block; font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 6px; padding: 0; text-transform: uppercase; letter-spacing: .05em; }
  .feld input[type=text], .feld select, .feld textarea {
    width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--linie);
    background: var(--karte); padding: 10px 12px; font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  .feld select {
    background-image: linear-gradient(45deg, transparent 50%, var(--text2) 50%), linear-gradient(135deg, var(--text2) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px;
  }
  .feld textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 16px; }
  .feld input:focus, .feld select:focus, .feld textarea:focus { outline: 0; border-color: var(--akzent); }
  .tagwahl { position: relative; }
  .tagwahl input { position: absolute; opacity: 0; pointer-events: none; }
  .tagwahl span { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; background: var(--chip); font-weight: 600; font-size: 15px; }
  .tagwahl input:checked + span { background: var(--akzent); color: var(--akzent-text); }
  .foto-feld { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .foto-feld .bild { width: 110px; height: 110px; border-radius: 16px; flex: none; }
  .foto-feld .bild-emoji { font-size: 48px; }
  .foto-knoepfe { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .foto-knoepfe .knopf { min-height: 44px; font-size: 15px; }

  /* Zufall */
  .zufall { padding: 44px calc(20px + var(--rechts)) 4px calc(20px + var(--links)); text-align: center; }
  .zufall h2 { font-size: 22px; }
  .wuerfel { font-size: 40px; display: inline-block; margin-bottom: 6px; }
  .wuerfel.rollt { animation: rollen .45s linear infinite; }
  @keyframes rollen { to { transform: rotate(360deg); } }
  .zufall-karte { background: var(--karte); border-radius: 20px; overflow: hidden; box-shadow: var(--schatten); margin: 14px auto 0; width: min(100%, 340px, 42vh); }
  .zufall-karte .bild { aspect-ratio: 1; }
  .zufall-karte .bild-emoji { font-size: 96px; }
  .zufall-karte h3 { margin: 0; padding: 14px 16px 4px; font-size: 20px; line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; justify-content: center; }
  .zufall-karte p { margin: 0; padding: 0 16px 14px; color: var(--text2); font-size: 14px; }
  .zufall-karte.landet { animation: landen .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes landen { from { transform: scale(.9); } to { transform: none; } }

  .einstellungen dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-size: 15px; }
  .einstellungen dt { color: var(--text2); }
  .einstellungen dd { margin: 0; font-weight: 600; text-align: right; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar) + var(--unten) + 14px); z-index: 60;
    transform: translate(-50%, 20px); opacity: 0; transition: .25s; pointer-events: none;
    background: #2A211B; color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 600;
    max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  .toast.zeigen { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="statusleiste"></div>

<div class="titelzeile">
  <h1>Was essen wir?</h1>
  <button class="rund" id="btn-neu" aria-label="Gericht hinzufügen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="rund" id="btn-einstellungen" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div>

<div class="klebend">
  <div class="suchzeile">
    <label class="suche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="suche" type="search" placeholder="Suchen, z. B. Kartoffel" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Gerichte durchsuchen">
      <button type="button" class="suche-leeren" id="suche-leeren" aria-label="Suche leeren" hidden>×</button>
    </label>
  </div>
  <div class="chipreihe" id="kategorien" aria-label="Kategorien"></div>
  <div class="chipreihe" id="unterkategorien" aria-label="Unterkategorien" hidden></div>
  <div class="chipreihe letzte" id="filter" aria-label="Filter"></div>
</div>

<main>
  <div class="infozeile">
    <span id="anzahl" aria-live="polite"></span>
    <button class="textknopf" id="filter-weg" hidden>Filter zurücksetzen</button>
  </div>
  <div class="raster" id="raster"></div>
  <div class="leer" id="leer" hidden><div>🤷</div>Nichts gefunden.</div>
</main>

<nav class="tabbar">
  <button class="tab" data-tab="alle" aria-current="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    Alle
  </button>
  <button class="tab" data-tab="favoriten" aria-current="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.7l-1.4-1.3C5.4 14.7 2 11.6 2 7.8 2 4.7 4.4 2.3 7.5 2.3c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6L12 20.7z"/></svg>
    Favoriten
  </button>
  <button class="tab" data-tab="zufall" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></g></svg>
    Zufall
  </button>
</nav>

<div class="sheet-huelle" id="sheet" hidden>
  <div class="sheet-hintergrund" data-aktion="zu"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-griff"></div>
    <button class="sheet-zu" data-aktion="zu" aria-label="Schließen">×</button>
    <div id="sheet-inhalt"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

const SPEICHER_KEY = 'familienEssen.v1';
const GITHUB_KEY = 'familienEssen.github'; // Schlüssel zum Speichern für alle, nur auf dem Handy des Admins

const KATEGORIEN = {
  'Hauptgerichte':                 { kurz: 'Hauptgerichte', emoji: '🍽️', farben: ['#F6B26B', '#E0522B'] },
  'Salate':                        { kurz: 'Salate',        emoji: '🥗', farben: ['#C4E68A', '#4E9F3D'] },
  'Suppen & Eintöpfe':             { kurz: 'Suppen',        emoji: '🍲', farben: ['#FFD08A', '#D9822B'] },
  'Nachspeisen & süßes Frühstück': { kurz: 'Süßes',         emoji: '🍮', farben: ['#F9C6D3', '#D96C8A'] },
  'Dips, Soßen & Dressings':       { kurz: 'Dips & Soßen',  emoji: '🥣', farben: ['#F3E3B3', '#C9A24B'] },
  'Extras':                        { kurz: 'Extras',        emoji: '🧅', farben: ['#E7C6F0', '#9B59B6'] },
  'Hausmittel':                    { kurz: 'Hausmittel',    emoji: '🍯', farben: ['#FFE29A', '#E0A526'] },
};
const UNTERKATEGORIEN = {
  'Pasta & Nudelgerichte':                       { kurz: 'Pasta',              emoji: '🍝', farben: ['#FFD59E', '#E8833A'] },
  'Aufläufe & Überbackenes':                     { kurz: 'Aufläufe',           emoji: '🧀', farben: ['#FFE7A3', '#E3A72F'] },
  'Fleischgerichte & Hausmannskost':             { kurz: 'Hausmannskost',      emoji: '🥩', farben: ['#F4A99A', '#B9452E'] },
  'Schnitzel & Cordon bleu':                     { kurz: 'Schnitzel',          emoji: '🍖', farben: ['#F7C88F', '#C46A2B'] },
  'Fisch & Meeresfrüchte':                       { kurz: 'Fisch',              emoji: '🐟', farben: ['#A8D8F0', '#2F7FB5'] },
  'Reisgerichte, Risotto & Currys':              { kurz: 'Reis & Curry',       emoji: '🍛', farben: ['#FFE08A', '#D99A1E'] },
  'Burger, Wraps, Tacos & Streetfood':           { kurz: 'Burger & Wraps',     emoji: '🌯', farben: ['#F9B98C', '#C9572F'] },
  'Kartoffelgerichte, Gemüse & Pfannengerichte': { kurz: 'Kartoffel & Gemüse', emoji: '🥔', farben: ['#E6D29A', '#A88438'] },
  'Herzhafte Eierspeisen':                       { kurz: 'Eier',               emoji: '🍳', farben: ['#FFF0A8', '#E5B82E'] },
};
const STANDARD_INFO = { emoji: '🍽️', farben: ['#EAD9C6', '#B08D6E'] };
const MIT_UNTERKATEGORIE = 'Hauptgerichte';
// Diese Kategorien zieht der Zufall nicht (außer man hat sie gerade selbst gewählt). Neue Gerichte darin bekommen B-IDs.
const BEILAGEN = new Set(['Dips, Soßen & Dressings', 'Extras', 'Hausmittel']);

const TAGS = [
  { id: 'fleisch',     label: 'Fleisch',         emoji: '🥩' },
  { id: 'fisch',       label: 'Fisch',           emoji: '🐟' },
  { id: 'vegetarisch', label: 'Vegetarisch',     emoji: '🥦' },
  { id: 'auflauf',     label: 'Aufläufe',        emoji: '🥘' },
  { id: 'protein',     label: 'High Protein / Low Cal', emoji: '💪' },
];
const ERNAEHRUNG = ['fleisch', 'fisch', 'vegetarisch'];
const ALTE_TAGS = ['schnell', 'kids']; // abgeschafft, werden beim Speichern entfernt
const TAG_SUCHWORTE = { vegetarisch: 'veggie', auflauf: 'auflauf gratin überbacken', protein: 'eiweiss kalorienarm fitness' };

const HERZ = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.7l-1.4-1.3C5.4 14.7 2 11.6 2 7.8 2 4.7 4.4 2.3 7.5 2.3c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6L12 20.7z"/></svg>';
const HERZ_LEER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.7l-1.4-1.3C5.4 14.7 2 11.6 2 7.8 2 4.7 4.4 2.3 7.5 2.3c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6L12 20.7z"/></svg>';

const $ = s => document.querySelector(s);
const sortierer = new Intl.Collator('de', { sensitivity: 'base', numeric: true });

let basis = [];        // Stand aus gerichte.json
let gerichte = [];     // basis + lokale Änderungen
let lokal = ladeLokal();
const zustand = { suche: '', kategorie: null, unterkategorie: null, filter: new Set(), nurFavoriten: false };
let offenesSheet = null; // { typ, id }

/* ---------- Hilfen ---------- */

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Kleinschreibung, Umlaute = Grundvokal = ae/oe/ue, ß = ss, Akzente weg, Satzzeichen zu Leerzeichen.
function norm(s) {
  return String(s ?? '').toLowerCase()
    .replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}

function info(g) {
  return UNTERKATEGORIEN[g.subcategory] || KATEGORIEN[g.category] || STANDARD_INFO;
}
function kurzname(g) {
  return (UNTERKATEGORIEN[g.subcategory] || KATEGORIEN[g.category] || {}).kurz || g.subcategory || g.category;
}
function tagInfo(id) { return TAGS.find(t => t.id === id) || { id, label: id, emoji: '🏷️' }; }

function sauber(g) {
  return {
    id: String(g.id),
    title: String(g.title ?? '').trim(),
    category: String(g.category ?? ''),
    subcategory: String(g.subcategory ?? ''),
    tags: Array.isArray(g.tags) ? g.tags.map(String).filter(t => !ALTE_TAGS.includes(t)) : [],
    image: String(g.image ?? ''),
  };
}
const gleich = (a, b) => JSON.stringify(sauber(a)) === JSON.stringify(sauber(b));

let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('zeigen');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('zeigen'), 2400);
}

/* ---------- Lokaler Speicher ---------- */

function leererSpeicher() {
  return {
    favoriten: [], geaendert: {}, geloescht: [], hoechsteId: { zahl: 115, b: 27 },
    veroeffentlicht: {}, // id → Zeitpunkt, an dem die Änderung an GitHub ging (bis gerichte.json sie enthält)
    vorschau: {},        // Bildpfad → data-URL, solange das hochgeladene Foto noch nicht auf der Seite ist
  };
}
function ladeLokal() {
  try {
    const roh = localStorage.getItem(SPEICHER_KEY);
    if (roh) return Object.assign(leererSpeicher(), JSON.parse(roh));
  } catch (e) { /* privat-Modus o. ä. */ }
  return leererSpeicher();
}
function speichern() {
  try {
    localStorage.setItem(SPEICHER_KEY, JSON.stringify(lokal));
    return true;
  } catch (e) {
    lokal = ladeLokal(); // Änderung verwerfen, Stand von vorher
    zusammenfuehren();
    toast(e && e.name === 'QuotaExceededError' ? 'Speicher voll – Foto zu groß?' : 'Konnte nicht speichern');
    return false;
  }
}

function zusammenfuehren() {
  const weg = new Set(lokal.geloescht);
  const basisIds = new Set(basis.map(g => g.id));
  const liste = basis.filter(g => !weg.has(g.id)).map(g => lokal.geaendert[g.id] || g);
  for (const [id, g] of Object.entries(lokal.geaendert)) {
    if (!basisIds.has(id) && !weg.has(id)) liste.push(g);
  }
  const katReihe = Object.keys(KATEGORIEN), unterReihe = Object.keys(UNTERKATEGORIEN);
  const pos = (arr, v) => { const i = arr.indexOf(v); return i < 0 ? 99 : i; };
  liste.sort((a, b) =>
    pos(katReihe, a.category) - pos(katReihe, b.category) ||
    sortierer.compare(a.category, b.category) ||
    pos(unterReihe, a.subcategory) - pos(unterReihe, b.subcategory) ||
    sortierer.compare(a.subcategory || '', b.subcategory || '') ||
    sortierer.compare(a.title, b.title));
  gerichte = liste;
  suchCache = new WeakMap();
}

function finde(id) { return gerichte.find(g => g.id === id); }
function istFavorit(id) { return lokal.favoriten.includes(id); }

function neueId(kategorie) {
  const b = BEILAGEN.has(kategorie);
  const alle = [...basis.map(g => g.id), ...Object.keys(lokal.geaendert), ...lokal.geloescht];
  const zahlen = alle.filter(id => (b ? /^B\d+$/ : /^\d+$/).test(id)).map(id => parseInt(id.replace('B', ''), 10));
  const n = Math.max(b ? lokal.hoechsteId.b : lokal.hoechsteId.zahl, ...zahlen) + 1;
  if (b) lokal.hoechsteId.b = n; else lokal.hoechsteId.zahl = n;
  return (b ? 'B' : '') + n;
}

/* ---------- Filtern & Suchen ---------- */

let suchCache = new WeakMap();
function suchtext(g) {
  let s = suchCache.get(g);
  if (!s) {
    const rest = [g.category, g.subcategory, kurzname(g), ...g.tags.map(t => tagInfo(t).label + ' ' + (TAG_SUCHWORTE[t] || ''))].join(' ');
    s = { titel: ' ' + norm(g.title), rest: norm(rest) };
    suchCache.set(g, s);
  }
  return s;
}

function gefiltert() {
  const woerter = norm(zustand.suche).split(' ').filter(Boolean);
  const ernaehrung = ERNAEHRUNG.filter(t => zustand.filter.has(t));
  const ergebnis = [];
  for (const g of gerichte) {
    if (zustand.kategorie && g.category !== zustand.kategorie) continue;
    if (zustand.unterkategorie && g.subcategory !== zustand.unterkategorie) continue;
    if (ernaehrung.length && !ernaehrung.some(t => g.tags.includes(t))) continue;
    if ([...zustand.filter].some(t => !ERNAEHRUNG.includes(t) && !g.tags.includes(t))) continue;
    if (zustand.nurFavoriten && !istFavorit(g.id)) continue;
    let rang = 0;
    if (woerter.length) {
      const { titel, rest } = suchtext(g);
      if (!woerter.every(w => titel.includes(w) || rest.includes(w))) continue;
      // 0: Titel beginnt mit dem Suchwort · 1: Suchwort als Wortanfang im Titel · 2: irgendwo im Titel · 3: nur Kategorie/Tags
      rang = !woerter.every(w => titel.includes(w)) ? 3
        : titel.startsWith(' ' + woerter[0]) ? 0
        : woerter.some(w => titel.includes(' ' + w)) ? 1 : 2;
    }
    ergebnis.push({ g, rang });
  }
  return woerter.length ? ergebnis.sort((a, b) => a.rang - b.rang) : ergebnis;
}

function filterAktiv() {
  return !!(zustand.suche.trim() || zustand.kategorie || zustand.filter.size || zustand.nurFavoriten);
}

/* ---------- Darstellung ---------- */

function bildHtml(g, mitHerz) {
  const i = info(g);
  return `<div class="bild" style="--c1:${i.farben[0]};--c2:${i.farben[1]}">` +
    `<span class="bild-emoji" aria-hidden="true">${i.emoji}</span>` +
    (g.image ? `<img src="${esc(lokal.vorschau[g.image] || g.image)}" alt="" loading="lazy" decoding="async">` : '') +
    (mitHerz ? herzKnopf(g.id) : '') +
    `</div>`;
}
function herzKnopf(id) {
  const an = istFavorit(id);
  return `<button class="herz" data-fav="${esc(id)}" aria-pressed="${an}" aria-label="Favorit"><span>${an ? HERZ : HERZ_LEER}</span></button>`;
}

function chip(label, an, daten, klein) {
  return `<button class="chip${klein ? ' klein' : ''}" aria-pressed="${!!an}" ${daten}>${label}</button>`;
}

function renderChips() {
  const kats = [...new Set(gerichte.map(g => g.category))];
  $('#kategorien').innerHTML =
    chip('Alle', !zustand.kategorie, 'data-kat=""') +
    kats.map(k => chip(`${(KATEGORIEN[k] || STANDARD_INFO).emoji} ${esc((KATEGORIEN[k] || {}).kurz || k)}`, zustand.kategorie === k, `data-kat="${esc(k)}"`)).join('');

  const unter = $('#unterkategorien');
  if (zustand.kategorie === MIT_UNTERKATEGORIE) {
    const subs = [...new Set(gerichte.filter(g => g.category === MIT_UNTERKATEGORIE && g.subcategory).map(g => g.subcategory))];
    unter.innerHTML =
      chip('Alle', !zustand.unterkategorie, 'data-unter=""', true) +
      subs.map(s => chip(`${(UNTERKATEGORIEN[s] || STANDARD_INFO).emoji} ${esc((UNTERKATEGORIEN[s] || {}).kurz || s)}`, zustand.unterkategorie === s, `data-unter="${esc(s)}"`, true)).join('');
    unter.hidden = false;
  } else {
    unter.hidden = true;
  }

  $('#filter').innerHTML =
    TAGS.map(t => chip(`${t.emoji} ${esc(t.label)}`, zustand.filter.has(t.id), `data-filter="${t.id}"`, true)).join('') +
    chip(`<span style="color:var(--herz)">♥</span> Nur Favoriten`, zustand.nurFavoriten, 'data-filter="favoriten"', true);

  document.querySelectorAll('.tab').forEach(t => {
    t.setAttribute('aria-current', String(t.dataset.tab === (zustand.nurFavoriten ? 'favoriten' : 'alle')));
  });
}

function renderRaster() {
  const treffer = gefiltert();
  const n = treffer.length;
  $('#anzahl').textContent = `${n} ${n === 1 ? 'Gericht' : 'Gerichte'}`;
  $('#filter-weg').hidden = !filterAktiv();
  $('#leer').hidden = n > 0;
  $('#leer').innerHTML = zustand.nurFavoriten && !lokal.favoriten.length
    ? '<div>🤍</div>Noch keine Favoriten.<br>Tippe auf das Herz bei einem Gericht.'
    : '<div>🤷</div>Nichts gefunden.';
  $('#raster').innerHTML = treffer.map(({ g }) =>
    `<article class="kachel" data-id="${esc(g.id)}">${bildHtml(g, true)}` +
    `<div class="kachel-text"><h3>${esc(g.title)}</h3><p>${esc(kurzname(g))}</p></div></article>`
  ).join('');
}

function render() {
  renderChips();
  renderRaster();
}

function nachOben() {
  const kopf = $('.titelzeile').offsetHeight;
  if (window.scrollY > kopf) window.scrollTo(0, kopf);
}

/* ---------- Bottom-Sheet ---------- */

function zeigeSheet(html, info) {
  const huelle = $('#sheet');
  $('#sheet-inhalt').innerHTML = html;
  offenesSheet = info;
  huelle.querySelector('.sheet').scrollTop = 0;
  if (!huelle.classList.contains('offen')) {
    huelle.hidden = false;
    document.documentElement.classList.add('gesperrt');
    huelle.offsetHeight; // Reflow, damit die Animation startet
    huelle.classList.add('offen');
  }
}
function schliesseSheet() {
  const huelle = $('#sheet');
  if (huelle.hidden) return;
  offenesSheet = null;
  zufallLaeuft = false;
  huelle.classList.remove('offen');
  document.documentElement.classList.remove('gesperrt');
  setTimeout(() => { if (!offenesSheet) { huelle.hidden = true; $('#sheet-inhalt').innerHTML = ''; } }, 300);
}

// Nach unten wischen schließt das Sheet, wenn es ganz oben steht.
(function wischenZumSchliessen() {
  const sheet = $('#sheet .sheet');
  let startY = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    startY = sheet.scrollTop <= 0 && !e.target.closest('input, select, textarea') ? e.touches[0].clientY : null;
    dy = 0;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (startY === null) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0 && sheet.scrollTop <= 0) {
      sheet.style.transition = 'none';
      sheet.style.transform = `translateY(${dy}px)`;
    }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (startY === null) return;
    sheet.style.transition = sheet.style.transform = '';
    if (dy > 110) schliesseSheet();
    startY = null;
  });
})();

/* ---------- Detailansicht ---------- */

function zeigeDetail(id) {
  const g = finde(id);
  if (!g) return schliesseSheet();
  const fav = istFavorit(id);
  zeigeSheet(`
    <div class="sheet-bild">${bildHtml(g, false)}</div>
    <div class="sheet-text">
      <h2>${esc(g.title)}</h2>
      <p class="meta">${esc(g.category)}${g.subcategory ? ' · ' + esc(g.subcategory) : ''}</p>
      <div class="umbruch">
        ${TAGS.map(t => `<label class="tagwahl"><input type="checkbox" data-aktion="tag" value="${t.id}" ${g.tags.includes(t.id) ? 'checked' : ''}><span>${t.emoji} ${esc(t.label)}</span></label>`).join('')}
      </div>
      <p class="hinweis">Tippen zum An-/Abwählen.</p>
      <div class="aktionen">
        <button class="knopf" data-aktion="fav" aria-pressed="${fav}">${fav ? HERZ : HERZ_LEER} Favorit</button>
        <button class="knopf" data-aktion="bearbeiten">Bearbeiten</button>
        <button class="knopf gefahr" data-aktion="loeschen">Löschen</button>
      </div>
    </div>`, { typ: 'detail', id });
}

function favoritUmschalten(id) {
  const i = lokal.favoriten.indexOf(id);
  if (i >= 0) lokal.favoriten.splice(i, 1); else lokal.favoriten.push(id);
  if (!speichern()) return;
  if (zustand.nurFavoriten) renderRaster();
  else document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b => b.outerHTML = herzKnopf(id));
  if (offenesSheet && offenesSheet.typ === 'detail' && offenesSheet.id === id) {
    const b = $('#sheet-inhalt [data-aktion="fav"]');
    const an = istFavorit(id);
    b.setAttribute('aria-pressed', an);
    b.innerHTML = `${an ? HERZ : HERZ_LEER} Favorit`;
  }
}

function gerichtSpeichern(g) {
  const original = basis.find(b => b.id === g.id);
  if (original && gleich(original, g)) delete lokal.geaendert[g.id];
  else lokal.geaendert[g.id] = sauber(g);
  lokal.geloescht = lokal.geloescht.filter(id => id !== g.id);
  delete lokal.veroeffentlicht[g.id];
  if (!speichern()) return false;
  zusammenfuehren();
  render();
  spaeterVeroeffentlichen(g.id);
  return true;
}

function loeschen(id) {
  const g = finde(id);
  if (!g || !confirm(`„${g.title}“ wirklich löschen?`)) return;
  delete lokal.geaendert[id];
  if (basis.some(b => b.id === id)) lokal.geloescht.push(id);
  lokal.favoriten = lokal.favoriten.filter(f => f !== id);
  delete lokal.veroeffentlicht[id];
  if (!speichern()) return;
  zusammenfuehren();
  render();
  schliesseSheet();
  toast('Gelöscht');
  spaeterVeroeffentlichen(id);
}

/* ---------- Bearbeiten / Hinzufügen ---------- */

let fotoNeu; // undefined = unverändert, '' = entfernt, sonst data-URL

function zeigeFormular(id) {
  const neu = !id;
  const g = neu
    ? { id: '', title: '', category: zustand.kategorie || MIT_UNTERKATEGORIE, subcategory: zustand.unterkategorie || '', tags: [], image: '' }
    : finde(id);
  if (!g) return;
  fotoNeu = undefined;
  const kats = [...new Set([...Object.keys(KATEGORIEN), ...gerichte.map(x => x.category)])];
  const subs = [...new Set([...Object.keys(UNTERKATEGORIEN), ...gerichte.filter(x => x.category === MIT_UNTERKATEGORIE).map(x => x.subcategory).filter(Boolean)])];
  const sub = g.subcategory || subs[0];
  zeigeSheet(`
    <form class="sheet-text ohne-bild formular" id="formular" data-id="${esc(g.id)}">
      <h2>${neu ? 'Neues Gericht' : 'Gericht bearbeiten'}</h2>
      <div class="foto-feld">
        <div id="foto-vorschau">${bildHtml(g, false)}</div>
        <div class="foto-knoepfe">
          <label class="knopf">📷 Foto wählen<input type="file" accept="image/*" id="foto-input" class="unsichtbar"></label>
          <button type="button" class="knopf" data-aktion="foto-weg" ${g.image ? '' : 'hidden'}>Foto entfernen</button>
        </div>
      </div>
      <label class="feld"><span>Name</span><input type="text" name="title" value="${esc(g.title)}" required maxlength="120" autocomplete="off" enterkeyhint="done"></label>
      <label class="feld"><span>Kategorie</span>
        <select name="category">${kats.map(k => `<option ${k === g.category ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
      </label>
      <label class="feld" id="feld-unter" ${g.category === MIT_UNTERKATEGORIE ? '' : 'hidden'}><span>Unterkategorie</span>
        <select name="subcategory">${subs.map(s => `<option ${s === sub ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      </label>
      <fieldset class="feld"><legend>Tags</legend>
        <div class="umbruch">${TAGS.map(t => `<label class="tagwahl"><input type="checkbox" name="tags" value="${t.id}" ${g.tags.includes(t.id) ? 'checked' : ''}><span>${t.emoji} ${esc(t.label)}</span></label>`).join('')}</div>
      </fieldset>
      <div class="aktionen">
        <button type="button" class="knopf" data-aktion="${neu ? 'zu' : 'zurueck'}">Abbrechen</button>
        <button type="submit" class="knopf primaer">Speichern</button>
      </div>
    </form>`, { typ: 'formular', id: g.id });
}

function formularVorschau() {
  const f = $('#formular');
  const g = {
    category: f.elements.category.value,
    subcategory: f.elements.category.value === MIT_UNTERKATEGORIE ? f.elements.subcategory.value : '',
    image: fotoNeu !== undefined ? fotoNeu : (finde(f.dataset.id) || {}).image || '',
  };
  $('#foto-vorschau').innerHTML = bildHtml(g, false);
  f.querySelector('[data-aktion="foto-weg"]').hidden = !g.image;
}

// Quadratisch zuschneiden und auf max. 800 px verkleinern.
function verkleinern(datei) {
  return new Promise((ok, fehler) => {
    const url = URL.createObjectURL(datei);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const ziel = Math.min(800, s);
      const c = document.createElement('canvas');
      c.width = c.height = ziel;
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, ziel, ziel);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error('Bild nicht lesbar')); };
    img.src = url;
  });
}

function formularAbschicken(f) {
  const title = f.elements.title.value.trim();
  if (!title) { f.elements.title.focus(); return; }
  const alt = f.dataset.id ? finde(f.dataset.id) : null;
  const category = f.elements.category.value;
  const g = {
    id: alt ? alt.id : neueId(category),
    title,
    category,
    subcategory: category === MIT_UNTERKATEGORIE ? f.elements.subcategory.value : '',
    tags: [...f.querySelectorAll('input[name=tags]:checked')].map(i => i.value),
    image: fotoNeu !== undefined ? fotoNeu : (alt ? alt.image : ''),
  };
  if (!gerichtSpeichern(g)) return;
  toast(alt ? 'Gespeichert' : 'Hinzugefügt');
  zeigeDetail(g.id);
}

/* ---------- Zufall ---------- */

let zufallLaeuft = false, letzterZufall = null;

function zufallsPool() {
  const liste = gefiltert().map(x => x.g);
  return BEILAGEN.has(zustand.kategorie) ? liste : liste.filter(g => !BEILAGEN.has(g.category));
}

function zufallKarte(g) {
  return `${bildHtml(g, false)}<h3>${esc(g.title)}</h3><p>${esc(kurzname(g))}</p>`;
}

function zeigeZufall() {
  const pool = zufallsPool();
  const ausgeschlossen = BEILAGEN.has(zustand.kategorie) ? '' : ' · ohne Dips, Extras & Hausmittel';
  if (!pool.length) {
    zeigeSheet(`<div class="zufall"><div class="wuerfel">🎲</div><h2>Was essen wir heute?</h2>
      <p class="meta">Mit den aktuellen Filtern gibt es nichts zum Auslosen.</p>
      <button class="knopf primaer voll" data-aktion="filter-weg">Filter zurücksetzen</button></div>`, { typ: 'zufall' });
    return;
  }
  zeigeSheet(`<div class="zufall">
      <div class="wuerfel" id="wuerfel">🎲</div>
      <h2>Was essen wir heute?</h2>
      <div class="zufall-karte" id="zufall-karte"></div>
      <p class="hinweis">aus ${pool.length} ${pool.length === 1 ? 'Gericht' : 'Gerichten'}${filterAktiv() ? ' (gefiltert)' : ''}${ausgeschlossen}</p>
      <div class="aktionen">
        <button class="knopf" data-aktion="nochmal">🎲 Nochmal</button>
        <button class="knopf primaer" data-aktion="ansehen">Ansehen</button>
      </div></div>`, { typ: 'zufall' });
  wuerfeln(pool);
}

function wuerfeln(pool) {
  pool = pool || zufallsPool();
  if (!pool.length) return;
  let ziel = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1) while (ziel.id === letzterZufall) ziel = pool[Math.floor(Math.random() * pool.length)];
  letzterZufall = ziel.id;
  const karte = $('#zufall-karte'), wuerfel = $('#wuerfel');
  const ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const schritte = ruhig || pool.length === 1 ? 0 : 14;
  zufallLaeuft = true;
  wuerfel.classList.add('rollt');
  karte.classList.remove('landet');
  let i = 0;
  (function schritt() {
    if (!zufallLaeuft || !document.contains(karte)) return;
    if (i < schritte) {
      karte.innerHTML = zufallKarte(pool[Math.floor(Math.random() * pool.length)]);
      i++;
      setTimeout(schritt, 45 + i * i * 1.6);
    } else {
      karte.innerHTML = zufallKarte(ziel);
      karte.dataset.id = ziel.id;
      void karte.offsetWidth;
      karte.classList.add('landet');
      wuerfel.classList.remove('rollt');
      zufallLaeuft = false;
    }
  })();
}

/* ---------- Einstellungen: Export / Import / Zurücksetzen ---------- */

// Eine Zeile pro Gericht, gleiches Format wie die Python-Scripts (json.dumps), damit Git-Diffs klein bleiben.
function gerichtZeile(g) {
  const wert = v => Array.isArray(v) ? '[' + v.map(x => JSON.stringify(x)).join(', ') + ']' : JSON.stringify(v);
  return '{' + Object.entries(sauber(g)).map(([k, v]) => `${JSON.stringify(k)}: ${wert(v)}`).join(', ') + '}';
}

function exportText() {
  const zeilen = gerichte.map(g => '  ' + gerichtZeile(g)).join(',\n');
  return `{\n "app": "familien-essen",\n "version": 1,\n "exportiert": "${new Date().toISOString()}",\n` +
    ` "favoriten": ${JSON.stringify(lokal.favoriten)},\n "gerichte": [\n${zeilen}\n ]\n}\n`;
}

function zeigeEinstellungen() {
  const neu = Object.keys(lokal.geaendert).filter(id => !basis.some(b => b.id === id)).length;
  const geaendert = Object.keys(lokal.geaendert).length - neu;
  let kb = 0;
  try { kb = Math.round((localStorage.getItem(SPEICHER_KEY) || '').length / 1024); } catch (e) { /* egal */ }
  zeigeSheet(`
    <div class="sheet-text ohne-bild einstellungen">
      <h2>Einstellungen</h2>
      <p class="meta">${github ? 'Favoriten bleiben auf diesem Handy, alles andere geht an alle.' : 'Änderungen und Favoriten sind nur auf diesem Handy gespeichert.'}</p>
      <dl>
        <dt>Gerichte</dt><dd>${gerichte.length}</dd>
        <dt>Favoriten</dt><dd>${lokal.favoriten.length}</dd>
        <dt>Neu angelegt</dt><dd>${neu}</dd>
        <dt>Geändert</dt><dd>${geaendert}</dd>
        <dt>Gelöscht</dt><dd>${lokal.geloescht.length}</dd>
        <dt>Belegter Speicher</dt><dd>${kb} KB</dd>
      </dl>

      ${githubAbschnitt()}

      <p class="abschnitt">Exportieren</p>
      <button class="knopf primaer voll" data-aktion="export">⬆️ Als Datei teilen / sichern</button>
      <button class="knopf voll" data-aktion="kopieren">📋 In Zwischenablage kopieren</button>
      <p class="hinweis">Zum Sichern, oder um Änderungen an den Admin zu schicken, der sie für alle übernimmt.</p>

      <p class="abschnitt">Importieren</p>
      <label class="knopf voll">⬇️ Datei importieren<input type="file" accept=".json,application/json,text/plain" id="import-input" class="unsichtbar"></label>
      <label class="feld" style="margin-top:10px"><textarea id="import-text" placeholder="…oder exportierten Text hier einfügen" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></label>
      <button class="knopf voll" data-aktion="import-text">Eingefügten Text importieren</button>

      <p class="abschnitt">Zurücksetzen</p>
      <button class="knopf gefahr voll" data-aktion="zuruecksetzen">Lokale Änderungen und Favoriten löschen</button>
      <p class="hinweis">Danach gilt wieder der gemeinsame Stand.</p>
    </div>`, { typ: 'einstellungen' });
}

async function exportieren() {
  const text = exportText();
  const name = `gerichte-export-${new Date().toISOString().slice(0, 10)}.json`;
  const datei = new File([text], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: 'Gerichte-Export' });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(datei);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function kopieren() {
  try {
    await navigator.clipboard.writeText(exportText());
    toast('Kopiert');
  } catch (e) {
    toast('Kopieren nicht möglich – bitte „Als Datei teilen“ nutzen');
  }
}

function importieren(text) {
  let daten;
  try { daten = JSON.parse(text); } catch (e) { toast('Das ist kein gültiger Export'); return; }
  const liste = Array.isArray(daten) ? daten : daten && daten.gerichte;
  if (!Array.isArray(liste) || !liste.length || !liste.every(g => g && g.id != null && g.title && g.category)) {
    toast('Das ist kein gültiger Export');
    return;
  }
  if (!confirm(`${liste.length} Gerichte importieren? Lokale Änderungen auf diesem Handy werden ersetzt.`)) return;
  const basisNachId = new Map(basis.map(g => [g.id, g]));
  const ids = new Set(liste.map(g => String(g.id)));
  const neu = leererSpeicher();
  for (const roh of liste) {
    const g = sauber(roh);
    const b = basisNachId.get(g.id);
    if (!b || !gleich(b, g)) neu.geaendert[g.id] = g;
  }
  neu.geloescht = basis.filter(b => !ids.has(b.id)).map(b => b.id);
  neu.favoriten = Array.isArray(daten.favoriten) ? daten.favoriten.map(String).filter(id => ids.has(id)) : lokal.favoriten;
  neu.hoechsteId = lokal.hoechsteId;
  neu.vorschau = lokal.vorschau;
  const vorher = lokal;
  lokal = neu;
  if (!speichern()) { lokal = vorher; return; }
  zusammenfuehren();
  render();
  schliesseSheet();
  toast(`${gerichte.length} Gerichte importiert`);
}

function zuruecksetzen() {
  if (!confirm('Alle lokalen Änderungen und Favoriten auf diesem Handy löschen?')) return;
  try { localStorage.removeItem(SPEICHER_KEY); } catch (e) { /* egal */ }
  lokal = leererSpeicher();
  zusammenfuehren();
  render();
  schliesseSheet();
  toast('Zurückgesetzt');
}

/* ---------- Für alle speichern (GitHub) ---------- */
// Mit Schlüssel schreibt die App Fotos nach bilder/ und Änderungen in gerichte.json im Repo.
// GitHub Pages veröffentlicht das nach 1–2 Minuten, dann sehen es alle beim nächsten Öffnen.

let github = (() => {
  try { return JSON.parse(localStorage.getItem(GITHUB_KEY)); } catch (e) { return null; }
})();

function repoAusAdresse() {
  const h = location.hostname;
  if (!h.endsWith('.github.io')) return '';
  const erstes = location.pathname.split('/').filter(Boolean)[0];
  return h.slice(0, -'.github.io'.length) + '/' + (erstes && !erstes.includes('.') ? erstes : h);
}

async function githubApi(konto, pfad, { methode = 'GET', daten, leerBei404 = false } = {}) {
  const antwort = await fetch(`https://api.github.com/repos/${konto.owner}/${konto.repo}${pfad}`, {
    method: methode,
    headers: {
      Authorization: `Bearer ${konto.token}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(daten ? { 'Content-Type': 'application/json' } : {}),
    },
    body: daten ? JSON.stringify(daten) : undefined,
    cache: 'no-store',
  });
  if (antwort.status === 404 && leerBei404) return null;
  if (!antwort.ok) throw Object.assign(new Error(`GitHub ${antwort.status}`), { status: antwort.status });
  return antwort.json();
}

function githubFehler(e) {
  if (!e.status) return 'Kein Internet – die Änderung bleibt vorerst auf diesem Handy';
  if (e.status === 401) return 'GitHub-Schlüssel ungültig oder abgelaufen';
  if (e.status === 403) return 'Der Schlüssel darf nicht schreiben (Contents: Read and write)';
  if (e.status === 404) return 'Repo oder gerichte.json nicht gefunden';
  if (e.status === 409 || e.status === 422) return 'Gleichzeitige Änderung – bitte nochmal speichern';
  return `GitHub-Fehler ${e.status}`;
}

function zuBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function ausBase64(b64) {
  return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
}

// Lokale Änderungen, die noch nicht an alle gegangen sind.
function offeneIds() {
  return [...new Set([...Object.keys(lokal.geaendert), ...lokal.geloescht])].filter(id => !lokal.veroeffentlicht[id]);
}

const geplant = new Set();
let planTimer;
// Kurz sammeln, damit mehrere Tag-Klicks hintereinander ein einziger Commit werden.
function spaeterVeroeffentlichen(id) {
  if (!github) return;
  geplant.add(id);
  clearTimeout(planTimer);
  planTimer = setTimeout(() => {
    const ids = [...geplant];
    geplant.clear();
    fuerAlleSpeichern(ids);
  }, 1200);
}

let warteschlange = Promise.resolve();
function fuerAlleSpeichern(ids) {
  if (!github || !ids.length) return Promise.resolve();
  toast('Wird für alle gespeichert …');
  const lauf = warteschlange.then(() => veroeffentlichen(ids)).then(
    () => toast('Für alle gespeichert – in 1–2 Min. sichtbar'),
    e => toast(githubFehler(e)));
  warteschlange = lauf;
  return lauf;
}

async function veroeffentlichen(ids) {
  const konto = github, ref = `?ref=${encodeURIComponent(konto.branch)}`;
  const vorher = Object.fromEntries(ids.map(id => [id, JSON.stringify(lokal.geaendert[id] || null)]));
  const staende = {};

  // 1. Neue Fotos als bilder/<id>.jpg hochladen. ?v= sorgt dafür, dass Handys das neue Bild laden statt des alten aus dem Cache.
  for (const id of ids) {
    const g = finde(id);
    if (!g) { staende[id] = null; continue; }
    const stand = sauber(g);
    if (stand.image.startsWith('data:image')) {
      const pfad = `bilder/${id}.jpg`;
      const alt = await githubApi(konto, `/contents/${pfad}${ref}`, { leerBei404: true });
      await githubApi(konto, `/contents/${pfad}`, {
        methode: 'PUT',
        daten: { message: `Foto: ${stand.title}`, content: stand.image.split(',')[1], branch: konto.branch, ...(alt ? { sha: alt.sha } : {}) },
      });
      const neuerPfad = `${pfad}?v=${Date.now().toString(36)}`;
      lokal.vorschau[neuerPfad] = stand.image;
      stand.image = neuerPfad;
    }
    staende[id] = stand;
  }

  // 2. Nur die betroffenen Gerichte in der aktuellen gerichte.json ersetzen – so gehen Änderungen anderer nicht verloren.
  const name = id => (staende[id] || basis.find(b => b.id === id) || { title: id }).title;
  const nachricht = `App: ${ids.map(name).join(', ')}`.slice(0, 72);
  for (let versuch = 0; ; versuch++) {
    const datei = await githubApi(konto, `/contents/gerichte.json${ref}`);
    const altText = ausBase64(datei.content);
    const roh = JSON.parse(altText);
    const liste = (Array.isArray(roh) ? roh : roh.gerichte).map(sauber);
    for (const [id, stand] of Object.entries(staende)) {
      const i = liste.findIndex(g => g.id === id);
      if (stand === null) { if (i >= 0) liste.splice(i, 1); }
      else if (i >= 0) liste[i] = stand;
      else liste.push(stand);
    }
    const text = '[\n' + liste.map(g => '  ' + gerichtZeile(g)).join(',\n') + '\n]\n';
    if (text === altText) break;
    try {
      await githubApi(konto, '/contents/gerichte.json', {
        methode: 'PUT',
        daten: { message: nachricht, content: zuBase64(text), sha: datei.sha, branch: konto.branch },
      });
      break;
    } catch (e) {
      if (e.status !== 409 || versuch) throw e; // jemand war schneller: neu laden und nochmal
    }
  }

  // 3. Lokal merken. Wurde das Gericht inzwischen schon wieder geändert, bleibt es offen.
  for (const [id, stand] of Object.entries(staende)) {
    if (JSON.stringify(lokal.geaendert[id] || null) !== vorher[id]) continue;
    if (stand) lokal.geaendert[id] = stand;
    lokal.veroeffentlicht[id] = Date.now();
  }
  speichern();
  zusammenfuehren();
  renderRaster();
}

// Beim Start: Was inzwischen in gerichte.json angekommen ist, braucht keine lokale Kopie mehr.
function aufraeumen() {
  const nachId = new Map(basis.map(g => [g.id, g]));
  for (const [id, zeit] of Object.entries(lokal.veroeffentlicht)) {
    const b = nachId.get(id), o = lokal.geaendert[id];
    const angekommen = o ? b && gleich(b, o) : !b;
    // Nach 15 Minuten gilt der gemeinsame Stand, auch wenn ihn inzwischen jemand anders geändert hat.
    if (angekommen || Date.now() - zeit > 15 * 60e3) {
      delete lokal.geaendert[id];
      lokal.geloescht = lokal.geloescht.filter(x => x !== id);
      delete lokal.veroeffentlicht[id];
    }
  }
  for (const [id, o] of Object.entries(lokal.geaendert)) {
    if (nachId.has(id) && gleich(nachId.get(id), o)) delete lokal.geaendert[id];
  }
  const benutzt = new Set(Object.values(lokal.geaendert).map(g => g.image));
  for (const pfad of Object.keys(lokal.vorschau)) {
    if (!benutzt.has(pfad)) delete lokal.vorschau[pfad];
  }
  speichern();
}

function githubAbschnitt() {
  if (github) {
    const offen = offeneIds().length;
    return `<p class="abschnitt">Für alle speichern</p>
      <p class="hinweis" style="margin-top:0">✅ Verbunden mit <b>${esc(github.owner)}/${esc(github.repo)}</b>. Fotos und Änderungen sehen alle nach 1–2 Minuten.</p>
      ${offen ? `<button class="knopf primaer voll" data-aktion="gh-jetzt">${offen} ${offen === 1 ? 'Änderung' : 'Änderungen'} jetzt für alle speichern</button>` : ''}
      <button class="knopf voll" data-aktion="gh-abmelden">Schlüssel von diesem Handy entfernen</button>`;
  }
  return `<p class="abschnitt">Für alle speichern</p>
    <p class="hinweis" style="margin-top:0">Für den Admin: Mit dem GitHub-Schlüssel gehen Fotos und Änderungen direkt an alle.</p>
    <label class="feld" style="margin-top:10px"><span>Repo</span><input type="text" id="gh-repo" value="${esc(repoAusAdresse())}" placeholder="name/essen" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="feld"><span>Schlüssel</span><input type="text" id="gh-token" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <button class="knopf voll" data-aktion="gh-verbinden">Verbinden</button>`;
}

async function githubVerbinden() {
  const [owner, repo] = $('#gh-repo').value.trim().split('/').map(s => s.trim());
  const token = $('#gh-token').value.trim();
  if (!owner || !repo || !token) return toast('Bitte Repo (name/repo) und Schlüssel eintragen');
  const konto = { owner, repo, token, branch: '' };
  try {
    konto.branch = (await githubApi(konto, '')).default_branch;
    await githubApi(konto, `/contents/gerichte.json?ref=${encodeURIComponent(konto.branch)}`);
  } catch (e) {
    return toast(githubFehler(e));
  }
  github = konto;
  try { localStorage.setItem(GITHUB_KEY, JSON.stringify(github)); } catch (e) { /* gilt dann nur bis zum Schließen */ }
  zeigeEinstellungen();
  toast('Verbunden – ab jetzt speicherst du für alle');
}

function githubAbmelden() {
  if (!confirm('GitHub-Schlüssel von diesem Handy entfernen? Änderungen bleiben dann wieder nur hier.')) return;
  github = null;
  try { localStorage.removeItem(GITHUB_KEY); } catch (e) { /* egal */ }
  zeigeEinstellungen();
}

/* ---------- Ereignisse ---------- */

function filterZuruecksetzen() {
  zustand.suche = '';
  $('#suche').value = '';
  $('#suche-leeren').hidden = true;
  zustand.kategorie = zustand.unterkategorie = null;
  zustand.filter.clear();
  zustand.nurFavoriten = false;
  render();
}

$('#suche').addEventListener('input', e => {
  zustand.suche = e.target.value;
  $('#suche-leeren').hidden = !e.target.value;
  renderRaster();
  nachOben();
});
$('#suche').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#suche-leeren').addEventListener('click', () => {
  $('#suche').value = '';
  zustand.suche = '';
  $('#suche-leeren').hidden = true;
  renderRaster();
});

$('.klebend').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  if (c.dataset.kat !== undefined) {
    zustand.kategorie = c.dataset.kat || null;
    zustand.unterkategorie = null;
  } else if (c.dataset.unter !== undefined) {
    zustand.unterkategorie = c.dataset.unter || null;
  } else if (c.dataset.filter === 'favoriten') {
    zustand.nurFavoriten = !zustand.nurFavoriten;
  } else if (c.dataset.filter) {
    const f = c.dataset.filter;
    zustand.filter.has(f) ? zustand.filter.delete(f) : zustand.filter.add(f);
  }
  const reihen = [...document.querySelectorAll('.chipreihe')].map(r => [r, r.scrollLeft]);
  render();
  reihen.forEach(([r, x]) => { r.scrollLeft = x; });
  nachOben();
});

$('#filter-weg').addEventListener('click', filterZuruecksetzen);

$('#raster').addEventListener('click', e => {
  const herz = e.target.closest('[data-fav]');
  if (herz) return favoritUmschalten(herz.dataset.fav);
  const k = e.target.closest('.kachel');
  if (k) zeigeDetail(k.dataset.id);
});

document.querySelector('.tabbar').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  if (t.dataset.tab === 'zufall') return zeigeZufall();
  zustand.nurFavoriten = t.dataset.tab === 'favoriten';
  render();
  window.scrollTo(0, 0);
});

$('#btn-neu').addEventListener('click', () => zeigeFormular(null));
$('#btn-einstellungen').addEventListener('click', zeigeEinstellungen);

$('#sheet').addEventListener('click', e => {
  const el = e.target.closest('[data-aktion]');
  if (!el) return;
  const id = offenesSheet && offenesSheet.id;
  switch (el.dataset.aktion) {
    case 'zu': schliesseSheet(); break;
    case 'zurueck': zeigeDetail(id); break;
    case 'fav': favoritUmschalten(id); break;
    case 'bearbeiten': zeigeFormular(id); break;
    case 'loeschen': loeschen(id); break;
    case 'nochmal': if (!zufallLaeuft) wuerfeln(); break;
    case 'ansehen': { const k = $('#zufall-karte'); if (!zufallLaeuft && k && k.dataset.id) zeigeDetail(k.dataset.id); break; }
    case 'filter-weg': filterZuruecksetzen(); zeigeZufall(); break;
    case 'foto-weg': fotoNeu = ''; formularVorschau(); break;
    case 'export': exportieren(); break;
    case 'kopieren': kopieren(); break;
    case 'import-text': importieren($('#import-text').value); break;
    case 'zuruecksetzen': zuruecksetzen(); break;
    case 'gh-verbinden': githubVerbinden(); break;
    case 'gh-jetzt': fuerAlleSpeichern(offeneIds()).then(zeigeEinstellungen); break;
    case 'gh-abmelden': githubAbmelden(); break;
  }
});

$('#sheet').addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.aktion === 'tag') {
    const g = finde(offenesSheet.id);
    const tags = TAGS.map(t => t.id).filter(t => t === el.value ? el.checked : g.tags.includes(t))
      .concat(g.tags.filter(t => !TAGS.some(x => x.id === t)));
    if (!gerichtSpeichern({ ...g, tags })) el.checked = !el.checked;
  } else if (el.name === 'category') {
    $('#feld-unter').hidden = el.value !== MIT_UNTERKATEGORIE;
    formularVorschau();
  } else if (el.name === 'subcategory') {
    formularVorschau();
  } else if (el.id === 'foto-input' && el.files[0]) {
    try {
      fotoNeu = await verkleinern(el.files[0]);
      formularVorschau();
    } catch (err) {
      toast('Dieses Bild kann nicht gelesen werden');
    }
    el.value = '';
  } else if (el.id === 'import-input' && el.files[0]) {
    importieren(await el.files[0].text());
    el.value = '';
  }
});

$('#sheet').addEventListener('submit', e => {
  e.preventDefault();
  formularAbschicken(e.target);
});

// Kaputte Bildpfade → Emoji-Fallback bleibt sichtbar.
document.addEventListener('error', e => {
  if (e.target.tagName === 'IMG' && e.target.closest('.bild')) e.target.remove();
}, true);

document.addEventListener('keydown', e => { if (e.key === 'Escape') schliesseSheet(); });

/* ---------- Start ---------- */

async function start() {
  try {
    // ?t= umgeht den CDN-Cache von GitHub Pages, damit Änderungen sofort ankommen.
    const antwort = await fetch(`gerichte.json?t=${Date.now()}`, { cache: 'no-store' });
    const daten = await antwort.json();
    basis = (Array.isArray(daten) ? daten : daten.gerichte).map(sauber);
  } catch (e) {
    $('#anzahl').textContent = '';
    $('#leer').hidden = false;
    $('#leer').innerHTML = '<div>⚠️</div>Die Gerichte konnten nicht geladen werden.<br>Bitte Internet prüfen und neu öffnen.';
    return;
  }
  aufraeumen();
  zusammenfuehren();
  render();
}
start();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
